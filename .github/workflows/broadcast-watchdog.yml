name: 播报看门狗（到点必发双保险）

on:
  schedule:
    # 北京 9:40（01:40 UTC）检查 9:20 商户不认可播报是否成功，没成功自动补发
    - cron: '40 1 * * *'
    # 北京 19:43（11:43 UTC）检查 19:20 质检差异率播报是否成功，没成功自动补发
    - cron: '43 11 * * *'
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 检查主定时播报并补发
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_HOOK: ${{ secrets.FEISHU_HOOK }}
          WATCHDOG_TOKEN: ${{ github.token }}
          TZ: Asia/Shanghai
        run: node tools/broadcast-watchdog-cloud.js
