name: 质检差异率每日播报

on:
  schedule:
    # 每天 11:15 UTC = 北京 19:15（避开整点：GitHub 整点任务易延迟/被丢弃）
    - cron: '15 11 * * *'
  workflow_dispatch:
    inputs:
      scheduled:
        description: 'Cloudflare 准点触发器置为 true，走定时语义（时段防护+去重标记）；手动补发留空'
        required: false
        default: ''

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 播报
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_HOOK: ${{ secrets.FEISHU_HOOK }}
          TZ: Asia/Shanghai
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.scheduled }}" = "true" ]; then
            node tools/daily-report-cloud.js --send --scheduled
          else
            node tools/daily-report-cloud.js --send
          fi
