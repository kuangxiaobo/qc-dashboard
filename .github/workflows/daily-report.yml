name: 质检差异率每日播报

on:
  schedule:
    # 每天 11:05 UTC = 北京 19:05
    - cron: '5 11 * * *'
  workflow_dispatch: {}

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 播报
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_HOOK: ${{ secrets.FEISHU_HOOK }}
          TZ: Asia/Shanghai
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            node tools/daily-report-cloud.js --send --scheduled
          else
            node tools/daily-report-cloud.js --send
          fi
